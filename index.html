<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name= "description" content="A web developer's expense calculator.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Expense Calculator</title>
		<link rel="stylesheet" href="styles/style.css">
	</head>
	<body>
		<section class="container">
			<h1>Expense Tracker</h1>
			
			<section class="balanceContainer">
				<h2>Your Balance</h2>
				<h1 id="balance">$0.00</h1>
				<section class="summary">
					<section class="income">
						<h3>Income</h3>
						<p id="incomeAmount">$0.00</p>
					</section>
					<section class="expenses">
						<h3>Expenses</h3>
						<p id="expenseAmount">$0.00</p>
					</section>
				</section>
			</section>
			
			<section class="mainContent">
				<section class="transactionContainer">
					<h2>Transactions</h2>
					<ul id="transactionList">
						
					</ul>
				</section>
				
				<section class="formContainer">
					<h2>Add Transaction</h2>
					<form id="transactionForm">
						<div class="formGroup">
							<label for="description">Description</label>
							<input type="text" id="description" placeholder="Enter description." required autofocus>
						</div>
						<div class="formGroup">
							<label for="amount">Amount</label>
							<input type="number" id="amount" placeholder="Enter amount." required>
							<small>Use negative (-) for expenses.</small>
						</div>
						<button type="submit"> Add Transaction</button>
					</form>
				</section>
			</section>
		</section>
		<script src="scripts/script.js"></script>
	</body>
</html>
